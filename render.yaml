services:
  - type: web
    name: bolao-copa-2026
    runtime: dotnet
    plan: free
    buildCommand: dotnet publish BolaoCopa2026.csproj -c Release -o out
    startCommand: dotnet out/BolaoCopa2026.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: SUPABASE_DATABASE_URL
        sync: false
